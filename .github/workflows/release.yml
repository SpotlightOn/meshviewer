name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

  build-linux:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Determine version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Build Linux distributables
        run: pnpm run dist:linux -- --publish never

      - name: Create source tarball
        run: |
          git archive --format=tar.gz -o "dist/meshviewer-${VERSION}.src.tar.gz" --prefix="meshviewer-${VERSION}/" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: meshviewer-linux
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/meshviewer-*.src.tar.gz

  build-win:
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Build Windows distributables
        run: pnpm run dist:win -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: meshviewer-win
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip

  build-mac:
    needs: checks
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Build macOS distributables
        run: pnpm run dist:mac -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: meshviewer-mac
          retention-days: 1
          if-no-files-found: error
          path: dist/*.dmg

  publish:
    needs: [build-linux, build-win, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: meshviewer-*
          merge-multiple: true
          path: dist

      - name: Publish release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          FILES=()
          for asset in dist/*.AppImage dist/*.src.tar.gz dist/*.exe dist/*.zip dist/*.dmg; do
            [ -e "$asset" ] && FILES+=("$asset")
          done
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release assets found in dist/" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          NOTES="$(awk -v s="## [${VERSION}]" 'index($0,s)==1 {flag=1; next} /^## \[/{flag=0; next} flag' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="$(awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Automated release of MeshViewer ${VERSION}."
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MeshViewer ${VERSION}" --notes "$NOTES"
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber