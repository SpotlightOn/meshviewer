<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeshViewer</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/",
        "three/": "./node_modules/three/",
        "i18next": "./node_modules/i18next/dist/esm/i18next.js"
      }
    }
  </script>
</head>
<body>
  <header class="toolbar">
    <button
      id="btn-up"
      class="icon-btn"
      type="button"
      data-i18n-title="toolbar.upTitle"
      data-i18n-aria-label="toolbar.upTitle"
    >
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M320-120v-230H120l360-450 360 450H640v230H320Zm60-60h200v-230h133L480-703 247-410h133v230Zm100-230Z" /></svg>
    </button>
    <button
      id="btn-home"
      class="icon-btn"
      type="button"
      data-i18n-title="toolbar.homeTitle"
      data-i18n-aria-label="toolbar.homeTitle"
    >
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M220-180h150v-250h220v250h150v-390L480-765 220-570v390Zm-60 60v-480l320-240 320 240v480H530v-250H430v250H160Zm320-353Z" /></svg>
    </button>
    <span class="toolbar-separator" aria-hidden="true"></span>
    <div id="pathbar-root" class="pathbar" data-i18n-title="toolbar.pathHint">
      <div id="path-segments" class="path-segments"></div>
      <input
        id="path-input"
        class="path-input"
        type="text"
        spellcheck="false"
        autocomplete="off"
        data-i18n-aria-label="currentDir.ariaLabel"
        data-i18n-title="currentDir.ariaLabel"
      />
    </div>
  </header>

  <main>
    <div class="layout">
      <aside class="sidebar">
        <div id="tree"></div>
      </aside>
      <section class="content">
        <div id="empty-state" class="empty-state">
          <img
            class="empty-logo"
            src="app://app/icons/meshviewer.svg"
            alt="MeshViewer"
          />
          <p id="empty-message" class="empty-message" data-i18n="emptyState">
            Select a folder in the directory tree on the left to display its *.glb files as 3D previews and image files (PNG, JPG, WebP, GIF, AVIF, BMP, SVG, ICO).
          </p>
        </div>
        <div id="grid" class="grid"></div>
        <div id="selection-info" class="selection-info" role="status" hidden></div>
      </section>
    </div>
  </main>

  <div id="large-view" class="large-view hidden">
    <header class="large-header">
      <button
        id="large-back"
        type="button"
        class="icon-btn"
        data-i18n-title="largeView.back"
        data-i18n-aria-label="largeView.back"
      >
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M400-240 160-480l241-241 43 42-169 169h526v60H275l168 168-43 42Z" /></svg>
      </button>
      <button
        id="large-details"
        type="button"
        class="icon-btn"
        data-i18n-title="largeView.info"
        data-i18n-aria-label="largeView.info"
      >
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" /></svg>
      </button>
      <button
        id="large-fullscreen"
        type="button"
        class="icon-btn"
        data-i18n-title="largeView.fullscreen"
        data-i18n-aria-label="largeView.fullscreen"
      >
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M120-120v-193h60v133h133v60H120Zm527 0v-60h133v-133h60v193H647ZM120-647v-193h193v60H180v133h-60Zm660 0v-133H647v-60h193v193h-60Z" /></svg>
      </button>
      <div class="large-right">
        <label class="switch">
          <input id="large-slideshow" type="checkbox" class="switch-input" />
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span class="switch-label" data-i18n="largeView.slideshow">Slideshow</span>
        </label>
        <div class="zoom-control">
          <input
            id="large-zoom"
            type="range"
            min="10"
            max="800"
            step="5"
            value="100"
            data-i18n-aria-label="largeView.zoom"
            data-i18n-title="largeView.zoom"
          />
          <input
            id="large-zoom-value"
            class="zoom-value"
            type="text"
            inputmode="numeric"
            value="100%"
            spellcheck="false"
            autocomplete="off"
            data-i18n-aria-label="largeView.zoomInput"
            data-i18n-title="largeView.zoomInput"
          />
          <button
            id="large-actual"
            type="button"
            class="icon-btn zoom-fit-btn"
            data-i18n-title="largeView.actualSize"
            data-i18n-aria-label="largeView.actualSize"
          >
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M280-280v-320h-80v-80h160v400h-80Zm160 0v-80h80v80h-80Zm200 0v-320h-80v-80h160v400h-80ZM440-440v-80h80v80h-80Z" /></svg>
          </button>
          <button
            id="large-fit"
            type="button"
            class="icon-btn zoom-fit-btn"
            data-i18n-title="largeView.fitToScreen"
            data-i18n-aria-label="largeView.fitToScreen"
          >
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M820-610v-130H690v-60h130q24 0 42 18t18 42v130h-60Zm-740 0v-130q0-24 18-42t42-18h130v60H140v130H80Zm610 450v-60h130v-130h60v130q0 24-18 42t-42 18H690Zm-550 0q-24 0-42-18t-18-42v-130h60v130h130v60H140Zm60-120v-400h560v400H200Zm60-60h440v-280H260v280Zm0 0v-280 280Z" /></svg>
          </button>
        </div>
      </div>
      <div id="slideshow-progress" class="slideshow-progress" aria-hidden="true"></div>
    </header>
    <div id="large-canvas" class="large-canvas"></div>
    <footer class="large-statusbar">
      <span id="large-file-info" class="large-file-info"></span>
      <div class="large-nav">
        <button
          id="large-prev"
          type="button"
          class="icon-btn"
          data-i18n-title="largeView.previous"
          data-i18n-aria-label="largeView.previous"
          disabled
        >
          <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" /></svg>
        </button>
        <button
          id="large-next"
          type="button"
          class="icon-btn"
          data-i18n-title="largeView.next"
          data-i18n-aria-label="largeView.next"
          disabled
        >
          <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z" /></svg>
        </button>
      </div>
    </footer>
    <button
      id="large-fullscreen-exit"
      type="button"
      class="fullscreen-exit"
      data-i18n-title="largeView.fullscreenExit"
      data-i18n-aria-label="largeView.fullscreenExit"
    >
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M253-120v-133H120v-60h193v193h-60Zm394 0v-193h193v60H707v133h-60ZM120-647v-60h133v-133h60v193H120Zm527 0v-193h60v133h133v60H647Z" /></svg>
    </button>
  </div>

  <div id="context-menu" class="context-menu" role="menu" hidden></div>

  <div id="info-overlay" class="settings-overlay hidden">
    <div
      class="settings-dialog info-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="info-dialog-title"
    >
      <h2 id="info-dialog-title" data-i18n="info.title">File information</h2>
      <div id="info-content" class="info-content"></div>
      <div class="settings-actions">
        <button id="info-close" type="button" data-i18n="dialog.close">Close</button>
      </div>
    </div>
  </div>

  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="settings.title">Settings</h2>
      <fieldset>
        <legend data-i18n="settings.slideshow">Slideshow</legend>
        <div class="settings-row">
          <label for="settings-interval" data-i18n="settings.interval">Interval (seconds)</label>
          <input id="settings-interval" type="number" min="1" max="3600" step="1" />
        </div>
        <div class="settings-row">
          <label for="settings-transition" data-i18n="settings.transition">Transition</label>
          <select id="settings-transition">
            <option value="fade" data-i18n="settings.transitionFade">Fade</option>
            <option value="slide" data-i18n="settings.transitionSlide">Slide</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="settings-duration" data-i18n="settings.animationDuration"
            >Animation duration (ms)</label
          >
          <input id="settings-duration" type="number" min="0" max="5000" step="50" />
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="settings.externalTools">External tools</legend>
        <div class="settings-row">
          <label for="settings-editor" data-i18n="settings.editor">Editor command</label>
          <div class="settings-editor">
            <input id="settings-editor" type="text" placeholder="/usr/bin/gimp" />
            <button id="settings-editor-browse" type="button" data-i18n="settings.browse">
              Browse…
            </button>
          </div>
        </div>
        <p class="settings-hint" data-i18n="settings.editorHint">
          Used for “Edit with…” in the context menu. Leave empty to hide the entry.
        </p>
      </fieldset>
      <div class="settings-actions">
        <button id="settings-cancel" type="button" data-i18n="settings.cancel">Cancel</button>
        <button id="settings-save" type="button" data-i18n="settings.save">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
